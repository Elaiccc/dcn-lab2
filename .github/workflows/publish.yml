name: Publish Lab 2 image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lab code
        uses: actions/checkout@v6
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: eeelaic
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the lab image
        uses: docker/build-push-action@v7
        with:
          context: ./time_app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: eeelaic/sample-time-app:latest
      - name: Check the published image
        run: docker buildx imagetools inspect eeelaic/sample-time-app:latest
